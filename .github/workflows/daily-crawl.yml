name: 每日抓取苏州楼市数据

on:
  schedule:
    # GitHub Actions 的 cron 只用 UTC，且是「尽力而为」：官方文档明确说高负载时
    # 排队的运行会被直接丢弃、无重试无通知。整点（:00）是全球最拥挤的时刻
    # （所有人都在 0 * * * *），实测 2026-10-17 北京 9:00 首次上线就整点漏跑。
    # 对策三条：① 避开整点用奇数分钟 ② 多档冗余，前面漏了后面补
    # ③ 抓取幂等，多跑只是多一条快照，不污染数据
    - cron: '7 1 * * *'      # 09:07 北京（主）
    - cron: '27 1 * * *'     # 09:27 补
    - cron: '7 2 * * *'      # 10:07 补
    - cron: '37 2 * * *'     # 10:37 补
  workflow_dispatch:      # 手动触发
    inputs:
      force:
        description: '强制重抓（忽略「今天已抓」守卫）'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:                # 代码改动时也跑一次，便于验证
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write         # 需要提交数据回仓库

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 补跑守卫：今天「所有查询」都完整跑过才跳过。
      # 判据必须含完整性（fetched >= dtot）——只判日期的话，09:07 那档若
      # 抓一半崩了仍会写快照，后面三档全被跳过，当天数据永久缺页且不自愈。
      # 有了第二条查询（珺华赋大户型）后，「最后一条快照完整」也不够：
      # 主查询失败但大户型成功，照样会误判成今天已抓完，所以按查询条数判。
      # force=true（手动触发）可强制重抓。
      - name: 检查今天是否已抓取
        id: guard
        env:
          FORCE: ${{ inputs.force }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sqlite3, os, sys
          from datetime import datetime, timezone, timedelta
          today = datetime.now(timezone.utc).astimezone(
              timezone(timedelta(hours=8))).strftime("%Y-%m-%d")
          force = str(os.environ.get("FORCE", "")).strip().lower() == "true"
          try:
              cfg = json.load(open("scripts/queries.json", encoding="utf-8"))
              need = len(cfg.get("queries") or [])
          except Exception as e:
              print(f"# 读 queries.json 失败（按 1 条算）: {e}", file=sys.stderr)
              need = 1
          db = "data/housing.db"
          got = set()
          if os.path.exists(db):
              try:
                  c = sqlite3.connect(db)
                  rows = c.execute(
                      "SELECT query, fetched, dtot FROM snapshots "
                      "WHERE taken_at LIKE ?", (today + "%",)).fetchall()
                  c.close()
                  for q, f, d in rows:
                      if f is None or d is None:
                          continue
                      # d>0：必须抓满；d==0：只有一条都没抓到才算真的空
                      if f >= d and (d > 0 or f == 0):
                          got.add(q)
              except Exception as e:
                  print(f"# 读库失败（将照常抓取）: {e}", file=sys.stderr)
          done = len(got) >= need and not force
          print(f"# 今天={today} 需要查询={need} 已完成={len(got)} force={force}",
                file=sys.stderr)
          print(f"done={'true' if done else 'false'}")
          PY

      # 零第三方依赖：只用标准库，不需要 pip install
      # 查询集合在 scripts/queries.json 里（园区 140-180 + 珺华赋 180+大户型）
      - name: 抓取数据
        if: steps.guard.outputs.done != 'true'
        run: |
          python scripts/run_queries.py --db data/housing.db --interval 1.2

      - name: 导出静态 JSON
        if: steps.guard.outputs.done != 'true'
        run: |
          python scripts/export_static.py \
            --db data/housing.db \
            --out web/data.json

      - name: 提交数据变更
        if: steps.guard.outputs.done != 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add web/data.json data/housing.db
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 每日更新 $(date -u +%Y-%m-%d)"
            # 并发运行/上一次提交可能让 main 前进，先 rebase 再推，避免 non-fast-forward。
            # 必须显式记成功标志：循环最后一条命令是 sleep 时，即使 3 次 push 全失败，
            # 步骤也会以退出码 0 结束（bash 吞掉 && 链失败），导致数据只 commit 未 push。
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then
                ok=1
                break
              fi
              echo "第 $i 次推送失败，重试..."
              sleep 5
            done
            [ "$ok" = 1 ] || { echo "连续 3 次推送失败，本次数据未上传"; exit 1; }
          fi

      - name: 报告跳过原因
        if: steps.guard.outputs.done == 'true'
        run: echo "今天已有快照，跳过抓取（这是补跑档，正常现象）"
