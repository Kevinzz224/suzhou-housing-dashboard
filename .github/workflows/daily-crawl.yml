name: 每日抓取苏州楼市数据

on:
  schedule:
    # GitHub Actions 用 UTC。北京时间 9:00 = UTC 1:00。
    # 多档重试：GitHub 定时任务在高负载时会「丢弃」排队中的运行（官方文档承认），
    # 单档 cron 实测会整点漏跑（2026-10-17 北京 9:00 首次验证就漏了）。
    # 抓取是幂等的（同一天多跑只是多几条快照），所以用多档冗余换可靠性。
    - cron: '0 1 * * *'      # 09:00 北京
    - cron: '30 1 * * *'     # 09:30 重试
    - cron: '0 2 * * *'      # 10:00 重试
    # ↓ 临时探针：验证调度器是否工作，确认后删除
    - cron: '*/10 * * * *'
  workflow_dispatch:      # 支持手动触发
  push:
    branches: [main]
    paths:                # 代码改动时也跑一次，便于验证
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write         # 需要提交数据回仓库

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 零第三方依赖：只用标准库，不需要 pip install
      - name: 抓取数据
        run: |
          python scripts/webforms_crawl.py \
            --site scripts/sites/suzhou.json \
            --db data/housing.db \
            --param ddl_qy=RD002 \
            --param txt_Area1=140 \
            --param txt_Area2=180 \
            --param ddl_houseclass=1 \
            --param rb_HF_CODE=-1 \
            --param txt_Pro= \
            --param txt_Com= \
            --param txt_Price1= \
            --param txt_Price2= \
            --interval 1.2

      - name: 导出静态 JSON
        run: |
          python scripts/export_static.py \
            --db data/housing.db \
            --out web/data.json

      - name: 提交数据变更
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add web/data.json data/housing.db
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 每日更新 $(date -u +%Y-%m-%d)"
            # 并发运行/上一次提交可能让 main 前进，先 rebase 再推，避免 non-fast-forward
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "第 $i 次推送失败，重试..."
              sleep 5
            done
          fi
