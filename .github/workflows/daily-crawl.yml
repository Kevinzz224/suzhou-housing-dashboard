name: 每日抓取苏州楼市数据

on:
  schedule:
    # GitHub Actions 的 cron 只用 UTC，且是「尽力而为」：官方文档明确说高负载时
    # 排队的运行会被直接丢弃、无重试无通知。整点（:00）是全球最拥挤的时刻
    # （所有人都在 0 * * * *），实测 2026-10-17 北京 9:00 首次上线就整点漏跑。
    # 对策三条：① 避开整点用奇数分钟 ② 多档冗余，前面漏了后面补
    # ③ 抓取幂等，多跑只是多一条快照，不污染数据
    - cron: '7 1 * * *'      # 09:07 北京（主）
    - cron: '27 1 * * *'     # 09:27 补
    - cron: '7 2 * * *'      # 10:07 补
    - cron: '37 2 * * *'     # 10:37 补
  workflow_dispatch:      # 手动触发
    inputs:
      force:
        description: '强制重抓（忽略「今天已抓」守卫）'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:                # 代码改动时也跑一次，便于验证
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write         # 需要提交数据回仓库

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 补跑守卫：今天已经「完整」抓过才跳过。
      # 判据必须含完整性（fetched >= dtot > 0）——只判日期的话，09:07 那档若
      # 抓一半崩了仍会写快照，后面三档全被跳过，当天数据永久缺页且不自愈。
      # force=true（手动触发）可强制重抓。
      - name: 检查今天是否已抓取
        id: guard
        env:
          FORCE: ${{ inputs.force }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import sqlite3, os, sys
          from datetime import datetime, timezone, timedelta
          today = datetime.now(timezone.utc).astimezone(
              timezone(timedelta(hours=8))).strftime("%Y-%m-%d")
          force = str(os.environ.get("FORCE", "")).strip().lower() == "true"
          db = "data/housing.db"
          last = fetched = dtot = None
          if os.path.exists(db):
              try:
                  c = sqlite3.connect(db)
                  row = c.execute(
                      "SELECT taken_at, fetched, dtot FROM snapshots "
                      "ORDER BY taken_at DESC LIMIT 1").fetchone()
                  if row:
                      last, fetched, dtot = row
                  c.close()
              except Exception as e:
                  print(f"# 读库失败（将照常抓取）: {e}", file=sys.stderr)
          same_day = bool(last and last[:10] == today)
          # 完整性：抓到行数必须覆盖站点报的总条数（两列都有值且 >0）
          complete = bool(fetched and dtot and dtot > 0 and fetched >= dtot)
          done = same_day and complete and not force
          print(f"# 今天={today} 最后快照={last} fetched={fetched} dtot={dtot} "
                f"同日={same_day} 完整={complete} force={force}", file=sys.stderr)
          print(f"done={'true' if done else 'false'}")
          PY

      # 零第三方依赖：只用标准库，不需要 pip install
      - name: 抓取数据
        if: steps.guard.outputs.done != 'true'
        run: |
          python scripts/webforms_crawl.py \
            --site scripts/sites/suzhou.json \
            --db data/housing.db \
            --param ddl_qy=RD002 \
            --param txt_Area1=140 \
            --param txt_Area2=180 \
            --param ddl_houseclass=1 \
            --param rb_HF_CODE=-1 \
            --param txt_Pro= \
            --param txt_Com= \
            --param txt_Price1= \
            --param txt_Price2= \
            --interval 1.2

      - name: 导出静态 JSON
        if: steps.guard.outputs.done != 'true'
        run: |
          python scripts/export_static.py \
            --db data/housing.db \
            --out web/data.json

      - name: 提交数据变更
        if: steps.guard.outputs.done != 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add web/data.json data/housing.db
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 每日更新 $(date -u +%Y-%m-%d)"
            # 并发运行/上一次提交可能让 main 前进，先 rebase 再推，避免 non-fast-forward。
            # 必须显式记成功标志：循环最后一条命令是 sleep 时，即使 3 次 push 全失败，
            # 步骤也会以退出码 0 结束（bash 吞掉 && 链失败），导致数据只 commit 未 push。
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then
                ok=1
                break
              fi
              echo "第 $i 次推送失败，重试..."
              sleep 5
            done
            [ "$ok" = 1 ] || { echo "连续 3 次推送失败，本次数据未上传"; exit 1; }
          fi

      - name: 报告跳过原因
        if: steps.guard.outputs.done == 'true'
        run: echo "今天已有快照，跳过抓取（这是补跑档，正常现象）"
