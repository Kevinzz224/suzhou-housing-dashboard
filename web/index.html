<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>苏州楼市 · 在售看板</title>
<style>
:root{
  --bg:#0b1120; --card:#151d2e; --card2:#1b2540; --line:#26314d;
  --tx:#e8edf7; --mut:#8b98b3; --acc:#4f8cff; --up:#ff5d6c; --dn:#22c98a;
  --gold:#f0b429;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:40px}
header{position:sticky;top:0;z-index:50;background:rgba(11,17,32,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 16px 10px}
.h-title{display:flex;align-items:baseline;gap:8px}
.h-title h1{font-size:18px;font-weight:700;letter-spacing:.5px}
.h-title span{font-size:11px;color:var(--mut)}
.h-sub{margin-top:6px;font-size:11px;color:var(--mut);display:flex;gap:10px;flex-wrap:wrap}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dn);margin-right:4px;vertical-align:middle}
.wrap{padding:12px 12px 0;max-width:720px;margin:0 auto}
/* 统计卡 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.stat i{font-style:normal;font-size:10px;color:var(--mut);display:block;margin-top:2px}
.stat.acc b{color:var(--acc)} .stat.up b{color:var(--up)} .stat.gold b{color:var(--gold)}
/* tabs */
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer;transition:.15s}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
/* 卡片列表 */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;cursor:pointer;transition:.15s}
.card:active{transform:scale(.99);background:var(--card2)}
.row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pname{font-size:15px;font-weight:650;line-height:1.35}
.pname .sub{display:block;font-size:11px;color:var(--mut);font-weight:400;margin-top:2px}
.badge{flex:0 0 auto;text-align:right}
.badge .n{font-size:17px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.badge .t{font-size:10px;color:var(--mut)}
.metrics{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.m{font-size:11px;color:var(--mut)}
.m b{color:var(--tx);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.m b.up{color:var(--up)} .m b.dn{color:var(--dn)}
.bar{height:5px;background:var(--card2);border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#7aa7ff);border-radius:3px}
.bar-t{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);margin-top:5px}
/* 详情页 */
.detail{display:none;animation:slide .22s ease}
@keyframes slide{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.back{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:20px;padding:6px 13px;font-size:13px;margin-bottom:12px;cursor:pointer}
.d-head{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.d-head h2{font-size:17px;font-weight:700}
.d-head .co{font-size:11px;color:var(--mut);margin-top:3px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.kv div{text-align:center}
.kv b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.kv span{font-size:10px;color:var(--mut)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.sec h3{font-size:13px;font-weight:650;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.sec h3 em{font-style:normal;font-size:11px;color:var(--mut);font-weight:400}
/* sparkline */
.spark{width:100%;height:56px;display:block}
/* 表格 */
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--mut);font-weight:500;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);font-size:11px}
td{padding:7px 4px;border-bottom:1px solid rgba(38,49,77,.5);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
/* 订阅 */
.sub-input{display:flex;gap:8px;margin-bottom:12px}
.sub-input input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 12px;font-size:14px;outline:none}
.sub-input input:focus{border-color:var(--acc)}
.sub-input button{background:var(--acc);border:none;color:#fff;border-radius:10px;padding:0 16px;font-size:14px;font-weight:600;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 8px 6px 13px;font-size:13px;display:flex;align-items:center;gap:6px}
.chip button{background:var(--card2);border:none;color:var(--mut);width:18px;height:18px;border-radius:50%;font-size:12px;line-height:1;cursor:pointer}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:34px 0}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--acc);color:var(--tx);border-radius:22px;padding:9px 18px;font-size:13px;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:86vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.foot{text-align:center;color:var(--mut);font-size:10px;margin-top:16px;line-height:1.7}
</style>
</head>
<body>
<header>
  <div class="h-title"><h1>🏙️ 苏州楼市看板</h1><span id="lastcrawl"></span></div>
  <div class="h-sub">
    <span><i class="dot"></i>数据源：苏州住建局</span>
    <span id="snapinfo"></span>
  </div>
</header>

<div class="wrap">
  <!-- 总览 -->
  <div class="stats" id="stats"></div>

  <!-- 列表视图 -->
  <div id="listView">
    <div class="tabs" id="tabs">
      <div class="tab on" data-sort="alive">在售最多</div>
      <div class="tab" data-sort="rate">去化最快</div>
      <div class="tab" data-sort="price">均价最高</div>
      <div class="tab" data-sort="sold">成交最多</div>
    </div>
    <div id="projects"></div>
  </div>

  <!-- 详情视图 -->
  <div class="detail" id="detailView"></div>

  <!-- 订阅视图 -->
  <div id="subView" style="display:none">
    <div class="sub-input">
      <input id="kwInput" placeholder="输入楼盘关键词，如：凤起潮鸣苑">
      <button onclick="addSub()">订阅</button>
    </div>
    <div class="sec">
      <h3>我的订阅 <em>存在本机 · 换设备需重加</em></h3>
      <div class="chips" id="subs"></div>
    </div>
    <div class="sec">
      <h3>最近成交动态 <em>全库</em></h3>
      <div id="changes"></div>
    </div>
  </div>
</div>

<div class="foot">
  数据：苏州市区商品房销售网上管理系统（住建局）<br>
  页面为静态展示，不构成投资建议
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
let PRO=[], SUBS=[], CHANGES=[], sortKey='alive', view='list', MODE='api', CACHE=null;

/* ── 数据层：双模式 ───────────────────────────────
   本地跑 serve.py 时走 /api/*（可写订阅）；
   部署到 GitHub Pages 等纯静态托管时没有后端，自动降级读 data.json（只读）。
   用一次 /api/stats 探测后端是否存在，失败即切静态模式。 */
async function dataLayer(){
  try{
    const r=await fetch('/api/stats',{cache:'no-store'});
    if(r.ok){ MODE='api'; return; }
  }catch(e){}
  MODE='static';
  const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error('data.json 不存在，且无本地 API');
  CACHE=await r.json();
}
const J = async (path) => {
  if(MODE==='api') return fetch(path).then(r=>r.json());
  // 静态模式：从预计算好的 data.json 取
  const u=new URL(path,'http://x');
  switch(u.pathname){
    case '/api/stats': return CACHE.stats;
    case '/api/projects': return CACHE.projects;
    case '/api/subscriptions': return CACHE.subscriptions||[];
    case '/api/changes': return {changes:CACHE.changes||[]};
    case '/api/trend': return CACHE.trend||[];
    case '/api/project': {
      const nm=u.searchParams.get('name');
      const d=CACHE.project_details?.[nm];
      return d || {error:'项目不存在'};
    }
  }
  return {};
};

function fmt(n){return n==null?'-':n.toLocaleString('zh-CN')}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1900)}

async function load(){
  await dataLayer();
  const [st,pr,su]=await Promise.all([
    J('/api/stats'), J('/api/projects'), J('/api/subscriptions'),
  ]);
  PRO=pr; SUBS=mergeSubs(su);
  // 头部
  $('#lastcrawl').textContent = st.last_crawl ? '更新于 '+st.last_crawl.slice(5,16) : '';
  $('#snapinfo').textContent = (MODE==='static'?'静态数据 · ':'') + '快照 '+st.snapshot_count+' 次';
  // 统计卡
  const d=st.last_delta||{};
  const arrow=v=>v==null?'':(v>0?' <span style="color:var(--up)">▲'+v+'</span>':(v<0?' <span style="color:var(--dn)">▼'+(-v)+'</span>':''));
  $('#stats').innerHTML=`
    <div class="stat acc"><b>${fmt(st.alive)}</b><i>在售房源</i></div>
    <div class="stat up"><b>${fmt(st.sold)}</b><i>累计已售</i></div>
    <div class="stat gold"><b>${fmt(st.sold_today)}</b><i>今日成交</i></div>
    <div class="stat"><b>${PRO.length}</b><i>监测项目</i></div>`;
  renderList();
  renderSubs();
  loadChanges();
}

function renderList(){
  const sorted=[...PRO];
  const cmp={alive:(a,b)=>b.alive-a.alive, price:(a,b)=>(b.avg_price||0)-(a.avg_price||0),
             sold:(a,b)=>b.sold-a.sold, rate:(a,b)=>(b.sell_rate||0)-(a.sell_rate||0)};
  sorted.sort(cmp[sortKey]||cmp.alive);
  if(!sorted.length){$('#projects').innerHTML='<div class="empty">暂无数据，先跑一次爬虫~</div>';return}
  const subs=new Set((SUBS||[]).map(s=>s.keyword));
  // 订阅楼盘置顶（用户最关心的放最前）
  sorted.sort((a,b)=>(subs.has(b.project)?1:0)-(subs.has(a.project)?1:0));
  $('#projects').innerHTML=sorted.map(p=>`
    <div class="card" onclick="openDetail('${esc(p.project)}')"${subs.has(p.project)?' style="border-color:var(--acc)"':''}>
      <div class="row1">
        <div class="pname">${subs.has(p.project)?'★ ':''}${esc(p.project)}<span class="sub">${esc(p.company||'')}</span></div>
        <div class="badge"><div class="n">${fmt(p.alive)}</div><div class="t">在售套</div></div>
      </div>
      <div class="metrics">
        <div class="m">均价 <b>${fmt(p.avg_price)}</b> 元/㎡</div>
        <div class="m">面积 <b>${p.avg_area??'-'}</b> ㎡</div>
        <div class="m">成交 <b>${fmt(p.sold)}</b> 套</div>
        <div class="m">去化 <b class="${p.sell_rate>=50?'up':''}">${p.sell_rate}%</b></div>
      </div>
      <div class="bar"><i style="width:${Math.min(100,p.sell_rate||0)}%"></i></div>
      <div class="bar-t"><span>已售 ${p.sold} / ${p.total}</span><span>${p.sell_rate}%</span></div>
    </div>`).join('');
}

function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function openDetail(name){
  const d=await J('/api/project?name='+encodeURIComponent(name)+'&days=30');
  if(d.error){toast(d.error);return}
  view='detail';
  $('#listView').style.display='none';
  const dv=$('#detailView'); dv.style.display='block';
  const clearTxt = d.days_to_clear ? '约 '+d.days_to_clear+' 天' : '—';
  dv.innerHTML=`
    <div class="back" onclick="backList()">‹ 返回列表</div>
    <div class="d-head">
      <h2>${esc(d.project)}</h2>
      <div class="co">${esc(d.company)}</div>
      <div class="kv">
        <div><b style="color:var(--acc)">${fmt(d.alive)}</b><span>在售套数</span></div>
        <div><b style="color:var(--up)">${fmt(d.sold_total)}</b><span>累计已售</span></div>
        <div><b style="color:var(--gold)">${d.sell_rate}%</b><span>去化率</span></div>
      </div>
      <div class="kv" style="margin-top:12px">
        <div><b>${fmt(d.avg_price)}</b><span>在售均价</span></div>
        <div><b>${d.min_price&&d.max_price?fmt(d.min_price)+'~'+fmt(d.max_price):'-'}</b><span>价格区间</span></div>
        <div><b>${d.avg_area??'-'}</b><span>平均面积㎡</span></div>
      </div>
    </div>
    <div class="sec">
      <h3>销售与去化速度</h3>
      <div class="kv">
        <div><b style="color:var(--up)">${d.sold_7d}</b><span>近7天成交</span></div>
        <div><b style="color:var(--up)">${d.sold_30d}</b><span>近30天成交</span></div>
        <div><b>${d.new_7d}+${d.new_30d}</b><span>新推(7d/30d)</span></div>
      </div>
      <div class="kv" style="margin-top:12px">
        <div><b>${d.sold_rate_7d}</b><span>套/天(7d)</span></div>
        <div><b>${d.sold_rate_30d}</b><span>套/天(30d)</span></div>
        <div><b>${clearTxt}</b><span>预计清盘</span></div>
      </div>
      <div style="margin-top:10px;font-size:11px;color:var(--mut)">近30天成交金额约 <b style="color:var(--tx)">${fmt(d.amount_30d_wan)}</b> 万元</div>
    </div>
    <div class="sec">
      <h3>存量趋势 <em>每次抓取一个点</em></h3>
      ${sparkline(d.snapshots)}
    </div>
    <div class="sec">
      <h3>在售房源 <em>${d.alive} 套 · 按单价降序</em></h3>
      <table><tr><th>坐落</th><th class="r">面积</th><th class="r">单价</th></tr>
      ${d.alive_list.map(r=>`<tr><td>${esc(r.location)}</td><td class="r">${r.area}</td><td class="r">${fmt(r.price)}</td></tr>`).join('')}
      </table>
    </div>
    <div class="sec">
      <h3>最近成交 <em>${d.sold_total} 套</em></h3>
      <table><tr><th>坐落</th><th class="r">面积</th><th class="r">单价</th><th class="r">日期</th></tr>
      ${d.recent_sold.length?d.recent_sold.map(r=>`<tr><td>${esc(r.location)}</td><td class="r">${r.area}</td><td class="r">${fmt(r.price)}</td><td class="r">${r.sold_at}</td></tr>`).join(''):'<tr><td colspan="4" style="color:var(--mut);text-align:center;padding:16px">还没有检出成交，多跑几天就有啦</td></tr>'}
      </table>
    </div>`;
  window.scrollTo(0,0);
}

function backList(){view='list';$('#listView').style.display='';$('#detailView').style.display='none'}

function sparkline(snaps){
  if(!snaps||snaps.length<2) return '<div class="empty" style="padding:18px 0">数据点不足（至少 2 次抓取），明日此时可见趋势~</div>';
  const w=300,h=56,pad=3;
  const vals=snaps.map(s=>s.alive);
  const mn=Math.min(...vals), mx=Math.max(...vals), rg=(mx-mn)||1;
  const pts=snaps.map((s,i)=>{
    const x=pad+i*(w-2*pad)/(snaps.length-1);
    const y=h-pad-(s.alive-mn)/rg*(h-2*pad);
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  const last=vals[vals.length-1], first=vals[0], diff=last-first;
  const color=diff>0?'var(--dn)':(diff<0?'var(--up)':'var(--mut)');
  const area=`${pad},${h-pad} ${pts} ${w-pad},${h-pad}`;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polygon points="${area}" fill="rgba(79,140,255,.13)"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="2" y="11" fill="${color}" font-size="10">${diff>0?'+':''}${diff} 套</text>
    <text x="${w-2}" y="11" fill="var(--mut)" font-size="9" text-anchor="end">${snaps[0].date.slice(5)} → ${snaps[snaps.length-1].date.slice(5)}</text>
  </svg>`;
}

/* ── 订阅：localStorage 为准 ───────────────────────
   静态托管没有数据库，但订阅本质是「你手机上的收藏」，存本机完全够用，
   而且离线也能看。本地跑 serve.py 时会额外同步到服务端（用于推送）。 */
const LSK = 'sz_subs_v1';
function localSubs(){ try{ return JSON.parse(localStorage.getItem(LSK)||'[]'); }catch(e){ return []; } }
function saveLocalSubs(a){ try{ localStorage.setItem(LSK, JSON.stringify(a)); }catch(e){} }
function mergeSubs(remote){
  const L = localSubs();
  const seen = new Set(L.map(s=>s.keyword));
  for(const r of (remote||[])) if(r.keyword && !seen.has(r.keyword)){
    L.push({id:'r'+r.id, keyword:r.keyword, note:r.note||'', remote:true}); seen.add(r.keyword);
  }
  saveLocalSubs(L); return L;
}

async function loadChanges(){
  try{
    const r=await J('/api/changes');
    CHANGES=r.changes||[];
    if(!CHANGES.length){$('#changes').innerHTML='<div class="empty" style="padding:18px 0">暂无变化记录</div>';return}
    $('#changes').innerHTML='<table><tr><th>房源</th><th>变化</th><th class="r">日期</th></tr>'+
      CHANGES.slice(0,20).map(c=>`<tr><td>${esc(c.location||c.key_id)}</td><td style="color:var(--up)">${c.old}→${c.new}</td><td class="r">${(c.changed_at||'').slice(5,10)}</td></tr>`).join('')+'</table>';
  }catch(e){}
}

function renderSubs(){
  const el=$('#subs');
  if(!SUBS.length){el.innerHTML='<div class="empty" style="padding:14px 0;width:100%">还没有订阅，输入楼盘名添加~</div>';return}
  el.innerHTML=SUBS.map(s=>`<span class="chip">${esc(s.keyword)}<button onclick="delSub(${s.id})">×</button></span>`).join('');
}
async function addSub(){
  const kw=$('#kwInput').value.trim();
  if(!kw) return toast('先输入楼盘关键词~');
  const L=localSubs();
  if(L.some(s=>s.keyword===kw)) return toast('已经订阅过啦~');
  L.push({id:'L'+Date.now(), keyword:kw, note:''});
  saveLocalSubs(L); SUBS=L; renderSubs(); renderList();
  $('#kwInput').value='';
  toast('已订阅 '+kw+' ★（存在本机）');
  if(MODE==='api'){
    try{ await fetch('/api/subscriptions',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({keyword:kw})}); }catch(e){}
  }
}
async function delSub(id){
  let L=localSubs().filter(s=>String(s.id)!==String(id));
  saveLocalSubs(L); SUBS=L; renderSubs(); renderList();
  toast('已取消订阅');
  if(MODE==='api' && String(id).startsWith('r')){
    try{ await fetch('/api/subscriptions/delete',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({id:String(id).slice(1)})}); }catch(e){}
  }
}

// tabs
$('#tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab'); if(!t) return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); sortKey=t.dataset.sort; renderList();
});

// 底部 Tab（通过 header 副标题切换订阅视图）
document.querySelector('.h-sub').innerHTML+='<span style="color:var(--acc);cursor:pointer" onclick="toggleSub()">📌 订阅</span>';
